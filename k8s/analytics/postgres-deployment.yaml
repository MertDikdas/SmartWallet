apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-postgres

  template:
    metadata:
      labels:
        app: analytics-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: smartwallet_analytics

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-secret
                  key: ANALYTICS_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-secret
                  key: ANALYTICS_DB_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: analytics-postgres-pvc
