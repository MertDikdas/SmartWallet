apiVersion: apps/v1
kind: Deployment

metadata:
  name: finance-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: finance-postgres

  template:
    metadata:
      labels:
        app: finance-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: smartwallet_finance

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finance-secret
                  key: FINANCE_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-secret
                  key: FINANCE_DB_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: finance-postgres-pvc
