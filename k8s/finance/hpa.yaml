apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: finance-service

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: deployment
    name: finance-service
  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60