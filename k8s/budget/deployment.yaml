apiVersion: apps/v1
kind: Deployment

metadata:
  name: budget-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: budget-service

  template:
    metadata:
      labels:
        app: budget-service

    spec:
      containers:
        - name: budget-service
          image: ghcr.io/mertdikdas/smartwallet-budget:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: budget-config

            - secretRef:
                name: budget-secret

          volumeMounts:
            - name: jwt-public-key
              mountPath: /run/secrets/jwt_public_key
              subPath: jwt_public_key
              readOnly: true

      volumes:
        - name: jwt-public-key
          secret:
            secretName: jwt-public-key
