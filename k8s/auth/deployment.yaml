apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: smartwallet-auth:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: auth-config

            - secretRef:
                name: auth-secret

          volumeMounts:
            - name: jwt-private-key
              mountPath: /run/secrets/jwt_private_key
              subPath: jwt_private_key
              readOnly: true

            - name: jwt-public-key
              mountPath: /run/secrets/jwt_public_key
              subPath: jwt_public_key
              readOnly: true

      volumes:
        - name: jwt-private-key
          secret:
            secretName: jwt-private-key

        - name: jwt-public-key
          secret:
            secretName: jwt-public-key
