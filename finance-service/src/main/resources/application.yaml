spring:
  application:
    name: smartwallet-finance-service

  datasource:
    url: ${FINANCE_DB_URL:jdbc:postgresql://localhost:5434/smartwallet_finance}
    username: ${FINANCE_DB_USERNAME:smartwallet}
    password: ${FINANCE_DB_PASSWORD:smartwallet}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:smartwallet}
    password: ${RABBITMQ_PASSWORD:smartwallet}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

server:
  port: 8082

security:
  jwt:
    issuer: smartwallet-auth-service
    public-key: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG

outbox:
  publisher:
    fixed-delay-ms: 2000

app:
  recurring-transactions:
    scheduler-delay-ms: ${RECURRING_TRANSACTION_SCHEDULER_DELAY_MS:60000}

    retry:
      max-attempts: ${RECURRING_RETRY_MAX_ATTEMPTS:3}
      first-delay: ${RECURRING_RETRY_FIRST_DELAY:PT1M}
      second-delay: ${RECURRING_RETRY_SECOND_DELAY:PT5M}