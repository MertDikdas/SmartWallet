spring:
  application:
    name: budget-service
  datasource:
    url: ${BUDGET_DB_URL:jdbc:postgresql://localhost:5435/smartwallet_budget}
    username: ${BUDGET_DB_USERNAME:smartwallet}
    password: ${BUDGET_DB_PASSWORD:smartwallet}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:smartwallet}
    password: ${RABBITMQ_PASSWORD:smartwallet}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

server:
  port: 8083

security:
  jwt:
    issuer: smartwallet-auth-service
    public-key: classpath:keys/public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.hibernate.SQL: DEBUG

outbox:
  publisher:
    fixed-delay-ms: 2000