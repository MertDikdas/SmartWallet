name: SmartWallet CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - finance-service
          - budget-service
          - notification-service
          - analytics-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Generate temporary RSA keys
        shell: bash
        run: |
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/private.pem

          openssl rsa \
            -pubout \
            -in /tmp/private.pem \
            -out /tmp/public.pem

          mkdir -p auth-service/src/main/resources/keys
          mkdir -p finance-service/src/main/resources/keys
          mkdir -p budget-service/src/main/resources/keys
          mkdir -p notification-service/src/main/resources/keys
          mkdir -p analytics-service/src/main/resources/keys

          cp /tmp/private.pem \
            auth-service/src/main/resources/keys/private.pem

          cp /tmp/public.pem \
            auth-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            finance-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            budget-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            notification-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            analytics-service/src/main/resources/keys/public.pem

      - name: Make Maven Wrapper executable
        run: chmod +x "${{ matrix.service }}/mvnw"

      - name: Build and test service
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - test-services
      - validate-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker images
        run: docker compose build --progress=plain

  smoke-test:
    name: Start Stack and Smoke Test
    runs-on: ubuntu-latest

    needs:
      - test-services
      - validate-compose
      - build-docker-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate temporary RSA keys
        shell: bash
        run: |
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/private.pem

          openssl rsa \
            -pubout \
            -in /tmp/private.pem \
            -out /tmp/public.pem

          mkdir -p auth-service/src/main/resources/keys
          mkdir -p finance-service/src/main/resources/keys
          mkdir -p budget-service/src/main/resources/keys
          mkdir -p notification-service/src/main/resources/keys
          mkdir -p analytics-service/src/main/resources/keys

          cp /tmp/private.pem \
            auth-service/src/main/resources/keys/private.pem

          cp /tmp/public.pem \
            auth-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            finance-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            budget-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            notification-service/src/main/resources/keys/public.pem

          cp /tmp/public.pem \
            analytics-service/src/main/resources/keys/public.pem

      - name: Start SmartWallet stack
        run: |
          docker compose up \
            -d \
            --build \
            --wait \
            --wait-timeout 180

      - name: Check service health endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_health() {
            local service_name="$1"
            local url="$2"

            echo "Checking ${service_name}: ${url}"

            curl \
              --fail \
              --show-error \
              --silent \
              --retry 10 \
              --retry-delay 3 \
              --retry-connrefused \
              "$url"

            echo
            echo "${service_name} is healthy"
          }

          check_health "API Gateway" \
            "http://localhost:8080/actuator/health"

          check_health "Auth Service" \
            "http://localhost:8081/actuator/health"

          check_health "Finance Service" \
            "http://localhost:8082/actuator/health"

          check_health "Budget Service" \
            "http://localhost:8083/actuator/health"

          check_health "Notification Service" \
            "http://localhost:8084/actuator/health"

          check_health "Analytics Service" \
            "http://localhost:8085/actuator/health"

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop SmartWallet stack
        if: always()
        run: docker compose down --volumes --remove-orphans