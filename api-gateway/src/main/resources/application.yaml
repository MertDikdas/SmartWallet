spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/users/**

            - id: finance-service
              uri: ${FINANCE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/accounts/**, /api/transactions/**, /api/categories/**, /api/transfers/**

            - id: budget-service
              uri: ${BUDGET_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/budgets/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/analytics/**

server:
  port: 8080

security:
  jwt:
    issuer: smartwallet-auth-service
    public-key: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info
